[package]
name = "kaleidoscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Preview-first Illyaverse connection profile and managed hosts tool"
license = "MIT"

[dependencies]
fs2 = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "=2.5.8"
base64 = "=0.22.1"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "=1.0.28"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.6"
